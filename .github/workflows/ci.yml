name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # crenya's shared Frappe CI (public copy): MariaDB and Redis as services, own ports and bench, fails when no
  # tests ran. The old job installed redis-server but never started it, so ERPNext's install could not connect.
  # A public repository runs on GitHub-hosted runners.
  build:
    uses: codfatherlogic/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: posawesome
      frappe_versions: '["version-15"]'
      runs_on: '"ubuntu-latest"'
